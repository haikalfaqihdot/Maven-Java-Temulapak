spring.application.name=temulapak
server.port=8081

# ---- PostgreSQL (dapat di-override lewat environment variable) ----
# Database "temulapak" dibuat otomatis saat aplikasi start jika belum ada.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:temulapak}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Tabel dibuat oleh db/schema.sql (dijalankan sebelum Hibernate), lalu divalidasi Hibernate.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
spring.web.locale=id-ID
spring.web.locale-resolver=fixed

# ---- Upload ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
app.upload-dir=${UPLOAD_DIR:uploads}

# ---- Data awal (admin, fasilitas, dan data contoh) ----
app.seed-demo-data=true
