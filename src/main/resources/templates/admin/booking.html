<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/shell :: shell('Booking', 'booking', ~{::main})}">
<body>
<main>
    <section class="page-head">
        <div class="wrap">
            <nav class="crumb" aria-label="Navigasi"><a th:href="@{/admin/verifikasi}">Beranda</a><i class="bi bi-chevron-right"></i><b>Booking</b></nav>
            <h1>Booking</h1>
            <p class="sub">Semua pengajuan booking di TemuLapak.</p>
        </div>
    </section>
    <section class="page-body">
        <div class="wrap">
            <div class="table-card" th:if="${not #lists.isEmpty(daftar)}"><div class="table-wrap">
                <table class="tbl">
                    <thead><tr><th>Tempat</th><th>Penyewa</th><th>Pemilik</th><th>Periode</th><th>Estimasi total</th><th>Status</th></tr></thead>
                    <tbody>
                    <tr th:each="b : ${daftar}">
                        <td><b th:text="${b.tempat.namaTempat}">Tempat</b></td>
                        <td th:text="${b.penyewa.nama}">Penyewa</td>
                        <td th:text="${b.tempat.pemilik.nama}">Pemilik</td>
                        <td><b th:text="${@fmt.periodeSingkat(b.tanggalMulai, b.tanggalSelesai)}">Periode</b><span class="sm" th:text="${b.durasiLabel}">3 bulan</span></td>
                        <td th:text="${@fmt.rupiah(b.estimasiTotal)}">Rp 0</td>
                        <td><span th:replace="~{fragments/layout :: badge(${b.statusBooking.label}, ${b.statusBooking.name().toLowerCase()})}"></span></td>
                    </tr>
                    </tbody>
                </table></div></div>
            <div class="card empty" th:if="${#lists.isEmpty(daftar)}">Belum ada booking.</div>
        </div>
    </section>
</main>
</body>
</html>
