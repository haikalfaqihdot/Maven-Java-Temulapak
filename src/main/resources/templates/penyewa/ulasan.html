<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/shell :: shell('Tulis ulasan', 'booking', ~{::main})}">
<body>
<main>
    <section class="page-head">
        <div class="wrap">
            <nav class="crumb" aria-label="Navigasi"><a th:href="@{/}">Beranda</a><i class="bi bi-chevron-right"></i><a th:href="@{/penyewa/riwayat-booking}">Booking Saya</a><i class="bi bi-chevron-right"></i><b>Tulis ulasan</b></nav>
            <h1>Tulis ulasan</h1>
            <p class="sub" th:text="${tempat.namaTempat}">Tempat</p>
        </div>
    </section>
    <section class="page-body">
        <div class="wrap" style="max-width: 640px;">
            <form class="card" th:action="@{/penyewa/ulasan/{id}(id=${tempat.idTempat})}" th:object="${form}" method="post" novalidate>
                <div class="field">
                    <label for="rating">Rating *</label>
                    <select class="select" id="rating" name="rating" style="max-width: 240px;">
                        <option value="">Pilih rating</option>
                        <option th:each="n : ${#numbers.sequence(5, 1, -1)}" th:value="${n}" th:selected="${form.rating != null and form.rating == n}" th:text="${n} + ' dari 5'">5 dari 5</option>
                    </select>
                    <div class="err" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></div>
                </div>
                <div class="field">
                    <label for="komentar">Komentar</label>
                    <textarea class="textarea" id="komentar" th:field="*{komentar}" placeholder="Ceritakan pengalaman Anda menyewa tempat ini"></textarea>
                    <div class="err" th:if="${#fields.hasErrors('komentar')}" th:errors="*{komentar}"></div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-dark" type="submit">Kirim ulasan</button>
                    <a class="btn btn-line" th:href="@{/penyewa/riwayat-booking}">Batal</a>
                </div>
            </form>
        </div>
    </section>
</main>
</body>
</html>
